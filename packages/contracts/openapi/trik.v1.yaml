components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Mobile and API clients: token from /auth/login with device_name.'
    cookieSession:
      type: apiKey
      in: cookie
      name: trik_session
      description: 'Web app: Sanctum session after GET /sanctum/csrf-cookie and /auth/login.'
  parameters:
    WorkspaceId:
      in: header
      name: X-Workspace-Id
      required: true
      schema:
        type: string
        format: uuid
      description: The workspace to act in. The caller must be a member.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        maxLength: 255
      description: Any write may send one; retries with the same key replay the first response for 24 h.
    IdempotencyKeyRequired:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        maxLength: 255
      description: Required here. Use a new UUID per action and reuse it on retries.
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
      description: meta.next_cursor or meta.prev_cursor from the previous page
    OrganizationId:
      in: header
      name: X-Organization-Id
      required: true
      schema:
        type: string
        format: uuid
      description: The organization to act in. The caller must be in its people list.
  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/workspace-header-missing
            title: Bad Request
            status: 400
            code: workspace-header-missing
    Unauthenticated:
      description: Not signed in
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/unauthenticated
            title: Unauthorized
            status: 401
            code: unauthenticated
    Forbidden:
      description: Not a member, or missing a permission
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/missing-permission
            title: Forbidden
            status: 403
            code: missing-permission
            detail: You need the whatsapp.numbers.manage permission in this workspace.
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/not-found
            title: Not Found
            status: 404
            code: not-found
    Conflict:
      description: Conflicts with the current state (e.g. last owner, idempotency key in use)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/last-owner
            title: Conflict
            status: 409
            code: last-owner
    ValidationFailed:
      description: Invalid input
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    TooManyRequests:
      description: Rate limited or locked out
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/too-many-attempts
            title: Too Many Requests
            status: 429
            code: too-many-attempts
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. Switch on `code`.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        instance:
          type: string
        request_id:
          type: string
    ValidationProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    CursorMeta:
      type: object
      properties:
        per_page:
          type: integer
        next_cursor:
          type:
          - string
          - 'null'
        prev_cursor:
          type:
          - string
          - 'null'
    Message:
      type: object
      properties:
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
    RoleName:
      type: string
      enum:
      - owner
      - admin
      - agent
      - custom
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        role:
          $ref: '#/components/schemas/RoleName'
        organization_id:
          type: string
          format: uuid
    Session:
      type: object
      properties:
        type:
          type: string
          enum:
          - token
          - browser
        id:
          type: string
        name:
          type: string
        ip_address:
          type:
          - string
          - 'null'
        last_active_at:
          type:
          - string
          - 'null'
          format: date-time
        current:
          type: boolean
    Member:
      type: object
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/RoleName'
        custom_role:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            name:
              type: string
        joined_at:
          type: string
          format: date-time
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        permissions:
          type: array
          items:
            type: string
        built_in:
          type: boolean
    WhatsAppNumber:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        external_id:
          type: string
        waba_id:
          type:
          - string
          - 'null'
        display_phone_number:
          type:
          - string
          - 'null'
        verified_name:
          type:
          - string
          - 'null'
        status:
          type: string
        capabilities:
          type: array
          items:
            type: string
        webhook_url:
          type: string
    Template:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type: string
        language:
          type: string
        status:
          type: string
        category:
          type: string
        components:
          type: array
          items:
            type: object
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: integer
          description: Minor units (piastres, halalas)
        currency:
          type: string
          example: EGP
    Order:
      title: Order
      type: object
      required:
      - id
      - number
      - status
      - total
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: '1048'
        source:
          type: string
          enum:
          - chat
          - shopify
          - easyorders
        status:
          type: string
          enum:
          - new
          - confirming
          - awaiting_deposit
          - confirmed
          - ready_to_ship
          - shipped
          - delivered
          - returned
          - cancelled
        next_action:
          type:
          - string
          - 'null'
          enum:
          - fix_address
          - confirm
          - resend_deposit_link
          - null
          description: What the team should do next (the order bar in chat)
        contact_id:
          type: string
          format: uuid
        customer:
          type: object
          properties:
            name:
              type:
              - string
              - 'null'
            phone:
              type: string
        payment_method:
          type: string
          enum:
          - cod
          - prepaid
        subtotal:
          $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        cod_amount:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              variant:
                type:
                - string
                - 'null'
              sku:
                type:
                - string
                - 'null'
              quantity:
                type: integer
                minimum: 1
              unit_price:
                $ref: '#/components/schemas/Money'
              total:
                $ref: '#/components/schemas/Money'
        address:
          $ref: '#/components/schemas/OrderAddress'
        delivery:
          type: object
          properties:
            courier:
              type:
              - string
              - 'null'
            tracking_number:
              type:
              - string
              - 'null'
            tracking_url:
              type:
              - string
              - 'null'
        note:
          type:
          - string
          - 'null'
        placed_at:
          type: string
          format: date-time
        confirmed_at:
          type:
          - string
          - 'null'
          format: date-time
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
        shipped_at:
          type:
          - string
          - 'null'
          format: date-time
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
    WhatsAppMessage:
      title: WhatsAppMessage
      type: object
      properties:
        id:
          type: string
        number_id:
          type: string
        direction:
          type: string
          enum:
          - in
          - out
        provider_message_id:
          type:
          - string
          - 'null'
        contact_phone:
          type: string
        type:
          type: string
        status:
          type: string
          enum:
          - queued
          - sent
          - delivered
          - read
          - failed
          - received
        error:
          type:
          - object
          - 'null'
        sent_at:
          type:
          - string
          - 'null'
        delivered_at:
          type:
          - string
          - 'null'
        read_at:
          type:
          - string
          - 'null'
        received_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        sent_by:
          type:
          - string
          - 'null'
          format: uuid
          description: Team member who sent it (outbound, from the API or the inbox)
        content:
          type: object
          description: 'What the message says. Inbound: parsed fields (text, media_id, mime_type, reply_id, context_message_id, contact_name). Outbound: the Cloud API content object (text, template, interactive or media).'
    OrganizationRole:
      type:
      - string
      - 'null'
      enum:
      - owner
      - admin
      - billing
      - member
      - null
      description: Manages the organization; never gives access to a workspace's data (ADR 0012).
    Organization:
      type: object
