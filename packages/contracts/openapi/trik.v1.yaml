      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - open
          - closed
        contact:
          $ref: '#/components/schemas/Contact'
        assignee_id:
          type:
          - string
          - 'null'
          format: uuid
        number_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Replies go out from this number (the one the customer last wrote to)
        unread_count:
          type: integer
          minimum: 0
        last_message:
          type: object
          properties:
            at:
              type: string
              format: date-time
            direction:
              type: string
              enum:
              - in
              - out
            type:
              type: string
            preview:
              type:
              - string
              - 'null'
        last_inbound_at:
          type:
          - string
          - 'null'
          format: date-time
        window:
          $ref: '#/components/schemas/MessagingWindow'
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type:
          - string
          - 'null'
          format: date-time
    WorkspaceBadges:
      title: WorkspaceBadges
      type: object
      required:
      - unread
      - assigned_to_me
      description: 'Where work is waiting (from maintained counters). Live updates: `badges.updated` on the real-time channel `user:{id}`.'
      properties:
        unread:
          type: integer
          minimum: 0
          description: Open conversations with unread customer messages
        assigned_to_me:
          type: integer
          minimum: 0
          description: Open conversations assigned to the signed-in user
    WorkspaceWithBadges:
      title: WorkspaceWithBadges
      allOf:
      - $ref: '#/components/schemas/Workspace'
      - type: object
        required:
        - badges
        properties:
          badges:
            $ref: '#/components/schemas/WorkspaceBadges'
    OrganizationWithBadges:
      type: object
      description: One of the caller's organizations with only the workspaces they belong to.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/OrganizationRole'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceWithBadges'
      title: OrganizationWithBadges
