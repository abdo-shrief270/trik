  /commerce/shopify/install:
    post:
      operationId: installShopify
      summary: Start connecting a Shopify store (OAuth)
      tags:
      - Commerce
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-permission: commerce.stores.manage
      description: 'Requires `commerce.stores.manage`. Returns the Shopify consent URL to send the browser to. Shopify then redirects to `GET /webhooks/shopify/oauth/callback`, which checks Shopify''s HMAC, the shop, the age (10 minutes), the single-use state and that the member still has `commerce.stores.manage`, stores the token encrypted, starts the order backfill, and sends the browser to `{web}/settings/stores?shopify=connected&store=<id>` (or `?shopify_error=<code>`: `invalid-signature`, `invalid-shop`, `expired`, `shop-mismatch`, `forbidden`, `store-connected-elsewhere`, `denied`, `shopify-error`). 409 `store-connected-elsewhere` when another workspace has this shop; 503 `shopify-not-configured`. 10 per minute. Returns 404 where store connectors are not rolled out yet (feature flag `commerce`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - shop
              properties:
                shop:
                  type: string
                  maxLength: 255
                  description: The store's myshopify.com address; "laila" or a full admin URL also work. Custom domains are refused (422).
                  examples:
                  - laila-fashion.myshopify.com
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - authorize_url
                    - shop_domain
                    properties:
                      authorize_url:
                        type: string
                        format: uri
                      shop_domain:
                        type: string
                        examples:
                        - laila-fashion.myshopify.com
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /commerce/easyorders/install:
    post:
      operationId: installEasyOrders
      summary: Start connecting an EasyOrders store
      tags:
      - Commerce
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-permission: commerce.stores.manage
      description: 'Requires `commerce.stores.manage`. Returns EasyOrders'' authorized-app link to send the browser to. When the seller accepts, EasyOrders creates an API key (`orders:read,orders:update`) and the order webhooks, then POSTs `{api_key, store_id}` to `POST /webhooks/easyorders/install/{token}`: the token is single-use, lives 30 minutes and remembers the workspace and the member, whose permission is checked again. The webhook URL carries the store''s own token (only its SHA-256 is kept). EasyOrders signs neither, so every webhook is only a hint: Trik reads the order back with the store''s key. EasyOrders has no way to list orders, so there is no backfill. 10 per minute. Returns 404 where store connectors are not rolled out yet.'
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - install_url
                    properties:
                      install_url:
                        type: string
                        format: uri
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /commerce/stores/{store}:
    patch:
      operationId: updateStore
      summary: Choose what Trik writes back to the store
      tags:
      - Commerce
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: store
        required: true
        schema:
          type: string
          format: uuid
      x-permission: commerce.stores.manage
      description: 'Requires `commerce.stores.manage`. Only the settings given change. Write-back happens for changes made in Trik (an agent, the confirmation engine): a confirmation or cancellation, or a fixed address. It runs on the queue, and each write (or refusal) appears on the order timeline as `store_updated` / `store_update_failed`. Changes that came from the store are never written back. Returns 404 where store connectors are not rolled out yet (feature flag `commerce`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - settings
              properties:
                settings:
                  type: object
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    tag_orders:
                      type: boolean
                      description: 'Shopify: tag orders `trik-confirmed` / `trik-cancelled` (default on)'
                    write_address:
                      type: boolean
                      description: 'Shopify: send a fixed address as the shipping address, keeping its name and phone. EasyOrders: add it as a private order note (its API cannot edit addresses). Default on'
                    cancel_in_store:
                      type: boolean
                      description: 'Shopify: cancel the order there (restocked, no refund, customer not emailed) when it is cancelled in Trik (default off)'
                    write_status:
                      type: boolean
                      description: 'EasyOrders: set the order status to `confirmed` / `canceled` (default on)'
                  description: Only the store's platform keys are accepted (422 otherwise).
      responses:
        '200':
          description: The store
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Store'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: disconnectStore
      summary: Disconnect a store
      tags:
      - Commerce
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: store
        required: true
        schema:
          type: string
          format: uuid
      x-permission: commerce.stores.manage
      description: Requires `commerce.stores.manage`. Drops the token and stops routing the store's webhooks here; orders already imported stay. The app stays installed in the store until the seller removes it there. Idempotent. Returns 404 where store connectors are not rolled out yet (feature flag `commerce`).
      responses:
        '204':
          description: Disconnected
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /commerce/stores/{store}/backfill:
    post:
      operationId: backfillStore
      summary: Import the store's recent orders again
      tags:
      - Commerce
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      - in: path
        name: store
        required: true
        schema:
          type: string
          format: uuid
      x-permission: commerce.stores.manage
      description: 'Requires `commerce.stores.manage`. Runs after a failure, or once Shopify grants `read_all_orders` (90 days instead of 60). Safe to repeat: imports are idempotent and never overwrite a newer version of an order. Imported orders placed more than 48 hours ago are never sent a confirmation message. 409 `store-not-connected`, `backfill-running`, `backfill-unsupported` (EasyOrders: no way to list past orders). Returns 404 where store connectors are not rolled out yet (feature flag `commerce`).'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Store'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /compliance/requests:
    get:
      operationId: listPrivacyRequests
      summary: Privacy requests received for the workspace
      tags:
      - Compliance
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-permission: compliance.requests.view
      description: 'Requires `compliance.requests.view`. Newest first, the last 100. Never names the customer: the subject is stored encrypted and cleared once the request is done.'
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrivacyRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /compliance/requests/{privacyRequest}/export:
    get:
      operationId: downloadPrivacyExport
      summary: Download a customer's data export
      tags:
      - Compliance
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: privacyRequest
        required: true
        schema:
          type: string
          format: uuid
      x-permission: compliance.requests.export
      description: 'Requires `compliance.requests.export` (personal data: owners and admins). What Trik holds about the customer, per module (`orders`, `contacts`…), for the store owner to hand over. Sent as an attachment, `Cache-Control: no-store`; the download is audited. Kept encrypted for 30 days, then 404 `export-not-available`. 30 per minute.'
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    properties:
                      requested_at:
                        type: string
                        format: date-time
                      origin:
                        type: string
                        examples:
                        - shopify
                      origin_ref:
                        type:
                        - string
                        - 'null'
                        examples:
                        - laila-fashion.myshopify.com
                      orders:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      contacts:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{order}/risk:
    get:
      operationId: getOrderRisk
      summary: An order's refusal risk, and why
      tags:
      - Risk
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: order
        required: true
        schema:
          type: string
          format: uuid
      x-permission: orders.orders.view
      description: Requires `orders.orders.view`. 404 `risk-not-scored` before the order is scored. `top` is the three biggest reasons (not the baseline); `reasons` all of them, whose points sum to the score (before clamping to 0–100). The first time a score reaches the threshold, a `risk_flagged` entry lands on the order timeline. Returns 404 where refusal risk is not rolled out yet (feature flag `risk`).
      responses:
        '200':
          description: The risk
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OrderRisk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /risk/settings:
    get:
      operationId: getRiskSettings
      summary: The refusal risk threshold and weights
      tags:
      - Risk
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-permission: risk.settings.view
      description: Requires `risk.settings.view`. The weights in effect (defaults plus the seller's changes) and the defaults. Returns 404 where refusal risk is not rolled out yet (feature flag `risk`).
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/RiskSettings'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateRiskSettings
      summary: Change the threshold or weights
      tags:
      - Risk
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-permission: risk.settings.manage
      description: Requires `risk.settings.manage`. Only the fields given change; weights are points per rule (−50…50). Open orders are scored again with them (queued, the most recent 2,000). Returns 404 where refusal risk is not rolled out yet (feature flag `risk`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                threshold:
                  type: integer
                  minimum: 1
                  maximum: 100
                weights:
                  type: object
                  additionalProperties: false
                  properties:
                    baseline:
                      type: integer
                      minimum: -50
                      maximum: 50
                    refused_before:
                      type: integer
                      minimum: -50
                      maximum: 50
                    cancelled_before:
                      type: integer
                      minimum: -50
                      maximum: 50
                    unreachable_before:
                      type: integer
                      minimum: -50
                      maximum: 50
                    delivered_before:
                      type: integer
                      minimum: -50
                      maximum: 50
                    first_order:
                      type: integer
                      minimum: -50
                      maximum: 50
                    high_value:
                      type: integer
                      minimum: -50
                      maximum: 50
                    address_incomplete:
                      type: integer
                      minimum: -50
                      maximum: 50
                    address_flagged:
                      type: integer
                      minimum: -50
                      maximum: 50
                    late_night:
                      type: integer
                      minimum: -50
                      maximum: 50
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/RiskSettings'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /analytics/pilot:
    get:
      operationId: getPilotResults
      summary: Before vs after Trik
      tags:
      - Analytics
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-permission: analytics.reports.view
      description: Requires `analytics.reports.view`. `baseline`, `after` and `change` are null until there is a go-live date. `daily` covers the last 60 days (days without orders are left out).
      responses:
        '200':
          description: The results
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PilotResults'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updatePilotResults
      summary: Set the go-live date and the baseline length
      tags:
      - Analytics
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-permission: analytics.reports.manage
      description: 'Requires `analytics.reports.manage`. `live_at: null` goes back to the first WhatsApp confirmation. Not in the future.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                live_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
                baseline_days:
                  type: integer
                  minimum: 14
                  maximum: 180
      responses:
        '200':
          description: The results
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PilotResults'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /analytics/pilot/weekly.csv:
    get:
      operationId: downloadPilotWeekly
      summary: Weekly results as a spreadsheet
      tags:
      - Analytics
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-permission: analytics.reports.view
      description: 'Requires `analytics.reports.view`. One row per week (Monday, Cairo) from the start of the baseline: week, period (before, go-live week, after), orders, confirmed, cancelled, shipped, delivered, refused, open, the three rates and the median minutes to confirm. UTF-8 with a BOM (opens in Excel). 20 per minute.'
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workspace/invitations:
    get:
      operationId: listInvitations
      summary: Open invitations
      tags:
      - Team
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Cursor'
      x-permission: workspace.members.view
      description: Pending and expired invitations, newest first (accepted and withdrawn ones are in the audit log). Requires the `workspace.members.view` permission in the workspace.
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: inviteMember
      summary: Invite someone to the team
      tags:
      - Team
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      x-permission: workspace.members.manage
      description: 'Emails a link that works once, for 7 days, only for that address, and returns it too (to share it another way, e.g. on WhatsApp: it is shown only here). Inviting the same address again replaces the open invitation. Nobody offers a role with more permissions than they have; only an owner invites an owner. Needs a verified email; 20 per hour per person; at most 100 open per workspace. Requires the `workspace.members.manage` permission in the workspace.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - role
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                role:
                  $ref: '#/components/schemas/RoleName'
                custom_role_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: Required when role is custom.
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    allOf:
                    - $ref: '#/components/schemas/Invitation'
                    - type: object
                      required:
                      - url
                      properties:
                        url:
                          type: string
                          format: uri
                          description: The invitation link (shown once).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /workspace/invitations/{invitation}:
    delete:
      operationId: revokeInvitation
      summary: Withdraw an invitation
      tags:
      - Team
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: invitation
        required: true
        schema:
          type: string
          format: uuid
      x-permission: workspace.members.manage
      description: Its link stops working. Only an owner withdraws an invitation to be an owner. Requires the `workspace.members.manage` permission in the workspace.
      responses:
        '204':
          description: Withdrawn
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /invitations/{token}:
    get:
      operationId: showInvitation
      summary: What an invitation link is for
      tags:
      - Team
      security: []
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        description: The invitation link's token (the last part of /invite/{token}).
      description: 'Public (the token is the secret): the workspace, who invited, the role and the status, for the link''s page. 30 per minute per address.'
      responses:
        '200':
          description: The invitation
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/InvitationPreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      summary: Join the workspace
      tags:
      - Team
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        description: The invitation link's token (the last part of /invite/{token}).
      description: 'The signed-in account''s email must be the invited one. Joins the workspace with the offered role (and its organization, as a member), and verifies the email (the link was sent to it). Already a member: nothing changes. The link then stops working.'
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - workspace
                    properties:
                      workspace:
                        $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Mobile and API clients: token from /auth/login with device_name.'
    cookieSession:
      type: apiKey
      in: cookie
      name: trik_session
      description: 'Web app: Sanctum session after GET /sanctum/csrf-cookie and /auth/login.'
  parameters:
    WorkspaceId:
      in: header
      name: X-Workspace-Id
      required: true
      schema:
        type: string
        format: uuid
      description: The workspace to act in. The caller must be a member.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        maxLength: 255
      description: Any write may send one; retries with the same key replay the first response for 24 h.
    IdempotencyKeyRequired:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        maxLength: 255
      description: Required here. Use a new UUID per action and reuse it on retries.
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
      description: meta.next_cursor or meta.prev_cursor from the previous page
    OrganizationId:
      in: header
      name: X-Organization-Id
      required: true
      schema:
        type: string
        format: uuid
      description: The organization to act in. The caller must be in its people list.
  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/workspace-header-missing
            title: Bad Request
            status: 400
            code: workspace-header-missing
    Unauthenticated:
      description: Not signed in
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/unauthenticated
            title: Unauthorized
            status: 401
            code: unauthenticated
    Forbidden:
      description: Not a member, or missing a permission
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/missing-permission
            title: Forbidden
            status: 403
            code: missing-permission
            detail: You need the whatsapp.numbers.manage permission in this workspace.
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/not-found
            title: Not Found
            status: 404
            code: not-found
    Conflict:
      description: Conflicts with the current state (e.g. last owner, idempotency key in use)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/last-owner
            title: Conflict
            status: 409
            code: last-owner
    ValidationFailed:
      description: Invalid input
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    TooManyRequests:
      description: Rate limited or locked out
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://trik.chat/problems/too-many-attempts
            title: Too Many Requests
            status: 429
            code: too-many-attempts
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. Switch on `code`.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        instance:
          type: string
        request_id:
          type: string
    ValidationProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    CursorMeta:
      type: object
      properties:
        per_page:
          type: integer
        next_cursor:
          type:
          - string
          - 'null'
        prev_cursor:
          type:
          - string
          - 'null'
    Message:
      type: object
      properties:
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
    RoleName:
      type: string
      enum:
      - owner
      - admin
      - agent
      - custom
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        role:
          $ref: '#/components/schemas/RoleName'
        organization_id:
          type: string
          format: uuid
    Session:
      type: object
      properties:
        type:
          type: string
          enum:
          - token
          - browser
        id:
          type: string
        name:
          type: string
        ip_address:
          type:
          - string
          - 'null'
        last_active_at:
          type:
          - string
          - 'null'
          format: date-time
        current:
          type: boolean
    Member:
      type: object
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/RoleName'
        custom_role:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            name:
              type: string
        joined_at:
          type: string
          format: date-time
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        permissions:
          type: array
          items:
            type: string
        built_in:
          type: boolean
    WhatsAppNumber:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        external_id:
          type: string
        waba_id:
          type:
          - string
          - 'null'
        display_phone_number:
          type:
          - string
          - 'null'
        verified_name:
          type:
          - string
          - 'null'
        status:
          type: string
        capabilities:
          type: array
          items:
            type: string
        webhook_url:
          type: string
    Template:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type: string
        language:
          type: string
        status:
          type: string
        category:
          type: string
        components:
          type: array
          items:
            type: object
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: integer
          description: Minor units (piastres, halalas)
        currency:
          type: string
          example: EGP
    Order:
      title: Order
      type: object
      required:
      - id
      - number
      - status
      - total
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: '1048'
        source:
          type: string
          enum:
          - chat
          - shopify
          - easyorders
        status:
          type: string
          enum:
          - new
          - confirming
          - awaiting_deposit
          - confirmed
          - ready_to_ship
          - shipped
          - delivered
          - returned
          - cancelled
        next_action:
          type:
          - string
          - 'null'
          enum:
          - fix_address
          - confirm
          - resend_deposit_link
          - null
          description: What the team should do next (the order bar in chat)
        contact_id:
          type: string
          format: uuid
        customer:
          type: object
          properties:
            name:
              type:
              - string
              - 'null'
            phone:
              type: string
        payment_method:
          type: string
          enum:
          - cod
          - prepaid
        subtotal:
          $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        cod_amount:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              variant:
                type:
                - string
                - 'null'
              sku:
                type:
                - string
                - 'null'
              quantity:
                type: integer
                minimum: 1
              unit_price:
                $ref: '#/components/schemas/Money'
              total:
