    Store:
      title: Store
      type: object
      required:
      - id
      - platform
      - shop_domain
      - status
      - scopes
      - backfill
      - settings
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - shopify
          - easyorders
        shop_domain:
          type: string
          examples:
          - laila-fashion.myshopify.com
          description: 'Shopify: the myshopify.com domain. EasyOrders: the store id'
        name:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - active
          - uninstalled
          - disconnected
          description: '`uninstalled`: the app was removed in the store (or its token stopped working); `disconnected`: disconnected from Trik.'
        scopes:
          type: array
          items:
            type: string
          description: As granted by the store
        installed_at:
          type:
          - string
          - 'null'
          format: date-time
