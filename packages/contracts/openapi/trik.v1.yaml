                note:
                  type:
                  - string
                  - 'null'
      x-permission: orders.orders.update
      description: Requires the `orders.orders.update` permission in the workspace. A fixed address needs governorate, area and street (422 `address-incomplete`); store updates no longer overwrite it. Returns 404 where orders are not rolled out yet (feature flag).
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{order}/confirm:
    post:
      operationId: confirmOrder
      summary: Confirm an order (idempotent)
      tags:
      - Orders
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: order
        required: true
        schema:
          type: string
          format: uuid
      x-permission: orders.orders.confirm
      description: Requires the `orders.orders.confirm` permission in the workspace. Emits `order.confirmed.v1`. 409 `invalid-transition` (e.g. cancelled), `address-needs-fix`, `order-changed`. Returns 404 where orders are not rolled out yet (feature flag).
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{order}/cancel:
