      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/OrganizationRole'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    AuditEvent:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
          example: member.added
        actor:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            name:
              type: string
        subject:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            name:
              type: string
        workspace_id:
          type:
          - string
          - 'null'
        data:
          type:
          - object
          - 'null'
        ip:
          type:
          - string
          - 'null'
        at:
          type: string
          format: date-time
    OrganizationMember:
      type: object
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - billing
          - member
        workspaces:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              role:
                $ref: '#/components/schemas/RoleName'
    OutgoingMessage:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - text
          - template
          - buttons
          - media
        reply_to:
          type: string
        text:
          type: string
          maxLength: 4096
        template:
          type: object
          properties:
            name:
              type: string
            language:
              type: string
            components:
              type: array
              items:
                type: object
        body:
          type: string
        buttons:
          type: object
          additionalProperties:
            type: string
            maxLength: 20
          maxProperties: 3
        media:
          type: object
          properties:
            kind:
              type: string
              enum:
              - image
              - video
              - audio
              - document
              - sticker
            link:
              type: string
            id:
              type: string
            caption:
              type: string
            filename:
              type: string
      title: OutgoingMessage
    MessagingWindow:
      title: MessagingWindow
      type: object
      required:
      - open
      - closes_at
      - free_until
      - entry
      description: 'Free-form messages are allowed only while open (24 hours after the customer last wrote); templates always are. free_until: Meta free entry point (72 h after answering a customer who came from an ad); it makes messages free, it does not extend the window.'
      properties:
        open:
          type: boolean
        closes_at:
          type:
          - string
          - 'null'
          format: date-time
        free_until:
          type:
          - string
          - 'null'
          format: date-time
        entry:
          type:
          - string
          - 'null'
          enum:
          - ad
          - null
    Contact:
      title: Contact
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
          description: Digits, international (wa_id format)
    Conversation:
      title: Conversation
