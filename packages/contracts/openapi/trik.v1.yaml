      x-permission: orders.orders.confirm
      description: Requires the `orders.orders.confirm` permission in the workspace. Not possible once shipped (409 `invalid-transition`). Returns 404 where orders are not rolled out yet (feature flag).
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{order}/timeline:
