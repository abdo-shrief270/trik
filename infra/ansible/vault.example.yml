# Copy to vault.yml, fill in, then: ansible-vault encrypt vault.yml   (vault.yml is git-ignored)
# Generate secrets with: openssl rand -base64 36 | tr -d '/+=' | cut -c1-40

# GitHub Container Registry, read-only token (fine-grained PAT, "packages: read") to pull the images.
ghcr_user: ""
ghcr_token: ""
image_repo: ghcr.io/<github-owner>

postgres_superuser_password: ""
db_owner_password: ""
db_api_password: ""
redis_password: ""
centrifugo_api_key: ""
centrifugo_token_hmac_secret: ""

# Backups (docs/runbooks/backups.md). The passphrase encrypts every backup: keep a copy outside the server, or
# the off-server backups can't be read after losing it. Generate: openssl rand -base64 48 | tr -d '/+=\n'
backup_cipher_pass: ""
# Off-server copy, any S3-compatible bucket (e.g. Cloudflare R2: endpoint <account-id>.r2.cloudflarestorage.com,
# region auto, an API token with Object Read & Write on that bucket only). Empty = backups stay on this server.
backup_s3_bucket: ""
backup_s3_endpoint: ""
backup_s3_region: auto
backup_s3_key: ""
backup_s3_key_secret: ""
# A dead man's switch (e.g. a healthchecks.io check, period 5 min, grace 15 min): pinged by every good check,
# /fail on a bad one. Empty = problems only reach syslog (journalctl -t trik-backup).
backup_alert_url: ""

# Laravel
app_key: ""                     # php artisan key:generate --show
meta_app_secret: ""
meta_webhook_verify_token: ""

# Email, sending only (no mailbox needed): a transactional provider's SMTP, e.g. Resend (smtp.resend.com, user
# "resend", the API key as password) or Brevo. Leave mail_smtp_host empty to keep MAIL_MAILER=log.
mail_smtp_host: ""
mail_smtp_port: 587
mail_smtp_username: ""
mail_smtp_password: ""
mail_from_address: no-reply@trik.chat

# Shopify app (Dev Dashboard → the app → Client credentials). Empty until it exists; the previous secret only while rotating.
shopify_client_id: ""
shopify_client_secret: ""
shopify_previous_client_secret: ""

# Cloudflare Origin Certificate for trik.chat and *.trik.chat (Cloudflare → SSL/TLS → Origin Server).
origin_cert_pem: |
  -----BEGIN CERTIFICATE-----
  -----END CERTIFICATE-----
origin_cert_key: |
  -----BEGIN PRIVATE KEY-----
  -----END PRIVATE KEY-----
