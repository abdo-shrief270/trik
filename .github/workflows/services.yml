name: Services

on:
  pull_request:
    paths: ["services/**", ".github/workflows/services.yml"]
  push:
    branches: [main]
    paths: ["services/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [webhook-intake, message-writer, dispatcher]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache: false   # no third-party modules yet; enable with go.sum later
      - run: go vet ./...
      - run: go test -race ./...
