name: API

on:
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: "apps/api" }
      - id: check
        run: |
          if [ -f "apps/api/composer.json" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:19-alpine
        env: { POSTGRES_DB: trik_test, POSTGRES_USER: trik, POSTGRES_PASSWORD: trik }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trik" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, redis, intl, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/pest --parallel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: trik_test
          DB_USERNAME: trik
          DB_PASSWORD: trik
