name: Web

on:
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: "apps/web" }
      - id: check
        run: |
          if [ -f "apps/web/package.json" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version comes from packageManager in apps/web/package.json
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
