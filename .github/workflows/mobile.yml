name: Mobile

on:
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["apps/mobile/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: "apps/mobile" }
      - id: check
        run: |
          if [ -f "apps/mobile/pubspec.yaml" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
